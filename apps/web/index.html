<!doctype html>
<html lang="en-US">

<head>
  <meta charset="UTF-8" />
  <script>
    try {
      var t = (JSON.parse(localStorage.getItem("user-preferences")) || {}).state;
      t = t && t.theme;
      if (t !== "light" && t !== "dark" && t !== "system") t = "dark";
      if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.classList.remove("light", "dark");
      document.documentElement.classList.add(t);
    } catch (e) {
      document.documentElement.classList.add("dark");
    }
    // The page entrance (theme/recipes.css, .rise and .stagger) plays once per
    // visit: 400 ms after the last entrance animation ends, html gets
    // data-entered and later routes arrive in one frame.
    (function () {
      var timer;
      document.addEventListener("animationend", function (e) {
        if (e.animationName !== "studio-enter") return;
        clearTimeout(timer);
        timer = setTimeout(function () {
          document.documentElement.setAttribute("data-entered", "");
        }, 400);
      });
    })();
  </script>

  <title>PM Studio</title>
  <meta name="title" content="PM Studio">
  <meta name="description"
    content="PM Studio, the PM Film Production task board.">
  <meta name="keywords" content="project management, open source, task management, team collaboration, kanban, self-hosted">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kaneo.app">

    content="PM Studio, the PM Film Production task board.">

  <meta property="twitter:description"
    content="PM Studio, the PM Film Production task board.">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="PM Studio" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="application-name" content="PM Studio">
  <link rel="canonical" href="https://kaneo.app">

  <script>
    if (window.location.hostname === 'demo.kaneo.app') {
      const script = document.createElement('script');
      script.defer = true;
      script.setAttribute('data-domain', 'demo.kaneo.app');
      script.src = 'https://plausible.kaneo.app/js/script.js';
      document.head.appendChild(script);
    }

    if (window.location.hostname === 'cloud.kaneo.app') {
      window.plausible = window.plausible || function () {
        (window.plausible.q = window.plausible.q || []).push(arguments);
      };
      const script = document.createElement('script');
      script.defer = true;
      script.setAttribute('data-domain', 'cloud.kaneo.app');
      script.src = 'https://plausible.kaneo.app/js/script.js';
      document.head.appendChild(script);
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
